<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Gulaabo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-blur"></div>

  <main class="wrap">
    <section class="card">
      <div class="topbar">
        <div class="dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <div class="top-title">Happy Birthday!</div>

        <div class="emoji-box" aria-label="birthday emoji">🎀</div>
      </div>

      <div class="content">
        <h1 class="main-title">
          Happy Birthday,<br />
          Gulaabo! <span class="emoji">🌹</span>
        </h1>

        <p class="desc">
          Today is all about celebrating the most amazing person. I've created something magical just for you on your special day...
        </p>

        <p class="ready">Ready for your birthday surprise?</p>

        <div class="cat-area">🎁</div>

        <button class="btn" id="goBtn">Let's Gooo</button>
      </div>

      <div class="footer">
        Made with endless love for your special day 💕
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
